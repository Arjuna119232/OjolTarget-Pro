name: Build OjolTarget Pro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node Dependencies
        run: bun install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Platforms & Build Tools
        run: |
          # ubuntu-latest sudah punya Android SDK + sdkmanager; cukup tambah paket
          # yang dipakai build.sh (setup-android@v3 gagal di image baru: paket 'tools' hilang).
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-31" "platforms;android-35" "build-tools;35.0.0" || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare Assets & Build APK
        working-directory: ./android
        env:
          WEB_DIR: ../dist
        run: |
          chmod +x prepare-assets.sh build.sh pack_apk.py
          rm -f ./*.apk ./*.apk.idsig
          ./prepare-assets.sh
          ./build.sh

      - name: Show APK Info
        working-directory: ./android
        run: |
          ls -lh ./*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ./*.apk | head -5

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OjolTarget-Pro-APK
          path: android/OjolTarget-Pro-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Siapkan aset rilis
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          APK="$(ls android/OjolTarget-Pro-*.apk | head -1)"
          cp "$APK" android/OjolTarget-Pro-latest.apk
          VERSION="$(basename "$APK" .apk)"; VERSION="${VERSION#OjolTarget-Pro-}"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publikasikan ke Release (unduh langsung tanpa login)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: OjolTarget Pro ${{ env.APK_VERSION }}
          body: |
            APK build otomatis dari commit ${{ github.sha }}.
            Unduh: `OjolTarget-Pro-latest.apk`
          files: android/OjolTarget-Pro-latest.apk
          make_latest: true
