name: Build OjolTarget Pro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms & Build Tools
        run: |
          sdkmanager --install "platforms;android-31" "platforms;android-35" "build-tools;35.0.0"

      - name: Install aapt2 and packaging utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt python3 imagemagick

      - name: Prepare Assets & Build APK
        working-directory: ./android
        run: |
          chmod +x prepare-assets.sh build.sh pack_apk.py
          export ANDROID_HOME=$ANDROID_HOME
          export WEB_DIR="../dist"
          ./prepare-assets.sh
          ./build.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OjolTarget-Pro-Release-APK
          path: android/*.apk
          retention-days: 14
